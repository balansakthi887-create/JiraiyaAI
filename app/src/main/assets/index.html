<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>Maxter J AI</title>

<style>
:root {
  --bg: #050607;
  --orange: #ff7908;
  --text: #f8f8fa;
  --muted: #aeb7c5;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

.app {
  width: 100%;
  max-width: 600px;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  padding: max(8px, env(safe-area-inset-top)) 14px
           max(8px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, #20160f55, transparent 65%),
    #050607;
}

header {
  flex: 0 0 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 52px;
  height: 52px;
  flex: 0 0 52px;
  display: grid;
  place-items: center;
  border: 2px solid var(--orange);
  border-radius: 50%;
  color: var(--orange);
  font-size: 29px;
  box-shadow: 0 0 18px #ff79082c;
}

.brand-name {
  font-size: clamp(19px, 5vw, 29px);
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
  white-space: nowrap;
}

.brand-name span {
  color: var(--orange);
}

.brand-underline {
  width: 82%;
  height: 4px;
  margin: 4px auto 0;
  background: var(--orange);
  transform: rotate(-2deg);
  border-radius: 4px;
}

.menu-button {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border: 0;
  background: transparent;
  color: var(--orange);
  font-size: 32px;
}

.menu-panel {
  display: none;
  flex: 0 0 auto;
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid #6c3a19;
  border-radius: 14px;
  background: #111315;
}

.menu-panel.open {
  display: block;
}

.menu-panel button {
  padding: 9px 12px;
  margin: 5px 4px 0 0;
  border: 1px solid #4a3425;
  border-radius: 10px;
  background: #20170f;
}

/* Main character scene */
.character-stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  margin: 4px 0 10px;
  overflow: hidden;
  border-radius: 20px;
  background:
    radial-gradient(ellipse at 50% 42%, #342116 0%, #15100d 58%, #08090a 100%);
}

.character-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
}

.image-warning {
  position: absolute;
  inset: 40% 8% auto;
  color: var(--orange);
  text-align: center;
  font-size: 13px;
}

.greeting-bubble {
  position: absolute;
  z-index: 1;
  top: 14%;
  right: 5px;
  width: min(65%, 290px);
  padding: 12px;
  background: #090b0df2;
  border: 2px solid var(--orange);
  border-radius: 20px;
  box-shadow: 0 0 18px #ff79081c;
  line-height: 1.45;
  font-size: 14px;
}

.greeting-bubble strong {
  display: block;
  margin-bottom: 5px;
  font-size: 16px;
}

.bubble-symbol {
  float: right;
  color: var(--orange);
  font-size: 21px;
}

/* Conversation stays inside this area */
.chat-area {
  flex: 0 0 auto;
  min-height: 0;
  padding-top: 2px;
}

.chat-log {
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: 15vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin-bottom: 8px;
  scrollbar-width: thin;
  scrollbar-color: #6c452b transparent;
}

.chat-message {
  max-width: 94%;
  padding: 9px 12px;
  border-radius: 13px;
  line-height: 1.45;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.user-message {
  align-self: flex-end;
  text-align: right;
  background: #24170f;
  border: 1px solid #78401b;
}

.ai-message {
  align-self: flex-start;
  text-align: left;
  background: #151719;
  border: 1px solid #39332e;
}

/* One composer and one send button */
.composer {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  min-height: 66px;
  padding: 6px 8px;
  border: 2px solid var(--orange);
  border-radius: 44px;
  background: #0b0e10;
  box-shadow: 0 0 18px #ff790825;
}

.attach-button {
  width: 35px;
  height: 42px;
  flex: 0 0 35px;
  border: 0;
  background: transparent;
  color: #d7deeb;
  font-size: 29px;
}

#userInput {
  flex: 1 1 auto;
  width: 0;
  min-width: 0;
  padding: 10px 2px;
  border: 0;
  outline: none;
  color: white;
  background: transparent;
  font-size: 15px;
}

#userInput::placeholder {
  color: #a3afc1;
}

.composer-mic {
  width: 30px;
  height: 40px;
  flex: 0 0 30px;
  border: 0;
  background: transparent;
  color: #dbe3f1;
  font-size: 22px;
}

.composer-mic.listening {
  color: #ff7777;
}

.send-button {
  width: 49px;
  height: 49px;
  flex: 0 0 49px;
  border: 0;
  border-radius: 50%;
  background: var(--orange);
  color: #111;
  font-size: 28px;
  font-weight: bold;
}

footer {
  flex: 0 0 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 6px;
  border-top: 1px solid #292d33;
  color: #aeb7c5;
  font-size: 11px;
}

@media (max-height: 650px) {
  header {
    flex-basis: 56px;
  }

  .logo {
    width: 44px;
    height: 44px;
    flex-basis: 44px;
    font-size: 25px;
  }

  .character-stage {
    margin-top: 2px;
    margin-bottom: 6px;
  }

  .chat-log {
    max-height: 11vh;
  }

  .composer {
    min-height: 58px;
  }

  .send-button {
    width: 43px;
    height: 43px;
    flex-basis: 43px;
  }

  footer {
    flex-basis: 22px;
    margin-top: 4px;
  }
}
  /* Keep the Maxter J screen fixed */
html,
body {
width: 100%;
height: 100%;
margin: 0;
overflow: hidden;
overscroll-behavior: none;
}

.app {
width: 100%;
height: 100vh;
height: 100dvh;
min-height: 0;
overflow: hidden;
}

.character-stage {
flex: 1 1 auto;
min-height: 0;
}

.chat-area {
flex-shrink: 0;
}

.chat-log {
max-height: 12vh;
overflow-y: auto;
overscroll-behavior: contain;
}

.composer {
flex-shrink: 0;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">油</div>
    <div>
      <div class="brand-name">MAXTER <span>J</span></div>
      <div class="brand-underline"></div>
    </div>
  </div>

  <button class="menu-button" id="menuButton"
    aria-label="Open menu" aria-expanded="false">☰</button>
</header>

<div class="menu-panel" id="menuPanel">
  <strong id="languageTitle">Language / மொழி</strong><br>
  <button onclick="setLang('en')">English</button>
  <button onclick="setLang('ta')">தமிழ்</button>
  <button onclick="clearChat()" id="clearButton">Clear chat</button>
</div>

<section class="character-stage">
  <img class="character-image"
    id="characterImage"
    src="images/21574.png"
    alt="Maxter J character">

  <div class="image-warning" id="imageWarning" hidden>
    Character image missing. Check images/21574.png in GitHub.
  </div>

  <div class="greeting-bubble">
    <strong>
      <span id="bubbleTitle">Hey! I'm Jiraiya</span>
      <span class="bubble-symbol">☯</span>
    </strong>
    <span id="bubbleText">What do you want to know or do today?</span>
  </div>
</section>

<section class="chat-area">
  <div class="chat-log" id="chatLog" aria-live="polite"></div>

  <div class="composer">
    <button class="attach-button" id="attachButton"
      aria-label="Attachment" title="Attachment">＋</button>

    <input id="userInput" type="text" maxlength="500"
      placeholder="Ask Maxter J anything..."
      aria-label="Your message">

    <button class="composer-mic" id="composerMic"
      aria-label="Voice input" title="Voice input">♩</button>

    <button class="send-button" id="sendButton"
      aria-label="Send message">↑</button>
  </div>
</section>

<footer>
  <span id="footerStatus">● Offline • Starter mode</span>
  <span id="connectionText">Auto Switch</span>
</footer>

</div>

<script>
let lang = 'en';
let recognition = null;

const $ = id => document.getElementById(id);

$('characterImage').addEventListener('error', () => {
  $('imageWarning').hidden = false;
});

$('characterImage').addEventListener('load', () => {
  $('imageWarning').hidden = true;
});

function setLang(value) {
  lang = value;
  document.documentElement.lang = value;

  $('bubbleTitle').textContent = value === 'ta'
    ? 'வணக்கம்! நான் ஜிரையா'
    : "Hey! I'm Jiraiya";

  $('bubbleText').textContent = value === 'ta'
    ? 'இன்று என்ன தெரிந்துகொள்ள அல்லது செய்ய விரும்புகிறீர்கள்?'
    : 'What do you want to know or do today?';

  $('userInput').placeholder = value === 'ta'
    ? 'மேக்ஸ்டர் ஜேவிடம் கேளுங்கள்...'
    : 'Ask Maxter J anything...';

  $('languageTitle').textContent = value === 'ta'
    ? 'மொழி / Language'
    : 'Language / மொழி';

  $('clearButton').textContent = value === 'ta'
    ? 'உரையாடலை அழி'
    : 'Clear chat';

  $('footerStatus').textContent = value === 'ta'
    ? '● ஆஃப்லைன் • தொடக்கப் பதிப்பு'
    : '● Offline • Starter mode';
}

function addMessage(text, type) {
  const item = document.createElement('div');

  item.className = 'chat-message ' +
    (type === 'user' ? 'user-message' : 'ai-message');

  const prefix = type === 'user'
    ? (lang === 'ta' ? 'நீங்கள்: ' : 'You: ')
    : 'Maxter J: ';

  item.textContent = prefix + text;
  $('chatLog').appendChild(item);

  // Scroll only the conversation history, not the home page.
  $('chatLog').scrollTop = $('chatLog').scrollHeight;
}

function getOfflineReply(text) {
  const msg = text.toLowerCase().trim();

  if (msg.includes('hello') || msg.includes('hi') ||
      msg.includes('வணக்கம்')) {
    return lang === 'ta'
      ? 'வணக்கம்! இன்று உங்களுக்கு என்ன உதவி வேண்டும்?'
      : "Hello! I'm Maxter J. How can I help you today?";
  }

  if (msg.includes('your name') || msg.includes('உன் பெயர்') ||
      msg.includes('உங்கள் பெயர்')) {
    return lang === 'ta'
      ? 'என் பெயர் மேக்ஸ்டர் ஜே.'
      : 'My name is Maxter J.';
  }

  if (msg.includes('help') || msg.includes('உதவி')) {
    return lang === 'ta'
      ? 'உங்கள் கேள்வியை எழுதுங்கள். என்னால் முடிந்தவரை உதவுகிறேன்.'
      : 'Tell me what you need help with.';
  }

  if (msg.includes('thank') || msg.includes('நன்றி')) {
    return lang === 'ta'
      ? 'உங்களுக்கு உதவியதில் மகிழ்ச்சி!'
      : "You're welcome! Happy to help.";
  }

  return lang === 'ta'
    ? 'இந்தக் கேள்விக்கான பதில் எனது ஆஃப்லைன் பதிப்பில் இல்லை. விரிவான பதில்களுக்கு உண்மையான AI இணைப்பு தேவை.'
    : "I don't have an offline answer for that yet. A real AI connection is needed for broader questions.";
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang === 'ta' ? 'ta-IN' : 'en-IN';
  utterance.rate = 1;

  window.speechSynthesis.speak(utterance);
}

function sendMessage() {
  const input = $('userInput');
  const text = input.value.trim();

  if (!text) {
    input.focus();
    return;
  }

  addMessage(text, 'user');
  input.value = '';

  const response = getOfflineReply(text);
  addMessage(response, 'ai');
}

$('sendButton').addEventListener('click', sendMessage);

$('userInput').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    sendMessage();
  }
});

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage(
      lang === 'ta'
        ? 'இந்த உலாவியில் குரல் உள்ளீடு ஆதரிக்கப்படவில்லை.'
        : 'Voice input is not supported in this browser.',
      'ai'
    );
    return;
  }

  if (recognition) {
    try { recognition.stop(); } catch (error) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = lang === 'ta' ? 'ta-IN' : 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  $('composerMic').classList.add('listening');

  recognition.onresult = event => {
    $('userInput').value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    addMessage(
      lang === 'ta'
        ? 'குரல் உள்ளீடு தோல்வியடைந்தது. மைக்ரோஃபோன் அனுமதியைச் சரிபார்க்கவும்.'
        : 'Voice input failed. Check microphone permission.',
      'ai'
    );
  };

  recognition.onend = () => {
    $('composerMic').classList.remove('listening');
  };

  try {
    recognition.start();
  } catch (error) {
    $('composerMic').classList.remove('listening');
  }
}

$('composerMic').addEventListener('click', startVoice);

function clearChat() {
  $('chatLog').replaceChildren();
}

$('menuButton').addEventListener('click', () => {
  const panel = $('menuPanel');
  const isOpen = panel.classList.toggle('open');

  $('menuButton').setAttribute('aria-expanded', String(isOpen));
  $('menuButton').textContent = isOpen ? '✕' : '☰';
});

$('attachButton').addEventListener('click', () => {
  addMessage(
    lang === 'ta'
      ? 'கோப்பு இணைப்பு இன்னும் செயல்படுத்தப்படவில்லை.'
      : 'File attachments are not implemented yet.',
    'ai'
  );
});
</script>
</body>
</html>
