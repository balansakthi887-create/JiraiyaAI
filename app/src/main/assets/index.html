<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d1b">
<title>Maxter J AI</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #080d1b;
  --panel: #111b30;
  --blue: #55d8ff;
  --purple: #9274ff;
  --text: #f4f7ff;
  --muted: #98a8c5;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 30%,
      #19284b 0%, #0b1224 45%, var(--bg) 78%);
  color: var(--text);
  font-family: Arial, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
}

.app {
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  padding: 18px 18px 28px;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 1px solid #4b91d7;
  border-radius: 15px;
  background: #142541;
  color: var(--blue);
  font-size: 24px;
  box-shadow: 0 0 20px #48bfff20;
}

.brand-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 1px;
}

.brand-sub {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}

.icon-button {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 1px solid #344562;
  background: #111b30;
  font-size: 21px;
}

.menu-panel {
  display: none;
  margin-top: 12px;
  padding: 14px;
  border: 1px solid #344562;
  border-radius: 16px;
  background: var(--panel);
}

.menu-panel.open {
  display: block;
}

.menu-panel button {
  padding: 10px 13px;
  margin: 4px;
  border: 1px solid #344562;
  border-radius: 11px;
  background: #1a2944;
}

.hero {
  text-align: center;
  padding-top: 34px;
}

.online {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #9debd0;
  background: #17352f80;
  border: 1px solid #306451;
  padding: 7px 12px;
  border-radius: 30px;
  font-size: 12px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #63e6ad;
}
 /* Main character area */
.character-wrap {
width: 100%;
max-width: 420px;
min-height: 300px;
height: 42vh;
max-height: 440px;
margin: 12px auto;
display: flex;
align-items: center;
justify-content: center;
}

/* Large character image */
.character {
width: 100%;
height: 100%;
max-width: 420px;
overflow: hidden;
padding: 0;
border-radius: 22px;
background: #111827;
border: 1px solid rgba(255, 145, 55, 0.45);
box-shadow: 0 0 28px rgba(255, 110, 35, 0.14);
}

.character img {
display: block;
width: 100%;
height: 100%;
object-fit: contain;
object-position: center;
border-radius: inherit;
}

.orbit {
  position: absolute;
  inset: 4px;
  border: 1px solid #56cfff55;
  border-radius: 50%;
  box-shadow: 0 0 35px #5a8fff15;
}

.orbit:before {
  content: "";
  position: absolute;
  inset: 16px;
  border: 1px dashed #8e83ff60;
  border-radius: 50%;
}

.character {
  position: relative;
  width: 155px;
  height: 155px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle,
    #284c78 0%, #172c4c 55%, #101a30 75%);
  border: 1px solid #60bfff65;
  box-shadow: 0 0 42px #368bff30;
  font-size: 88px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

h1 {
  margin: 0;
  font-size: 29px;
  letter-spacing: 1px;
}

.tagline {
  color: var(--muted);
  font-size: 14px;
  margin-top: 10px;
  line-height: 1.6;
}

.quick-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin: 26px 0 18px;
}

.quick {
  padding: 14px 5px;
  border: 1px solid #293a59;
  border-radius: 15px;
  background: #121e34cc;
  font-size: 12px;
}

.quick span {
  display: block;
  font-size: 22px;
  margin-bottom: 8px;
}

.chat-panel {
  padding: 16px;
  border: 1px solid #2b3e60;
  border-radius: 22px;
  background: #111b30eF;
  box-shadow: 0 12px 40px #00000020;
}

.panel-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 13px;
}

#chatLog {
  display: flex;
  flex-direction: column;
  gap: 9px;
  max-height: 220px;
  overflow-y: auto;
  margin-bottom: 13px;
}

.chat-message {
  padding: 11px 13px;
  border-radius: 13px;
  line-height: 1.5;
  font-size: 14px;
  overflow-wrap: anywhere;
  text-align: left;
}

.user-message {
  align-self: flex-end;
  max-width: 90%;
  background: #263f69;
}

.ai-message {
  align-self: flex-start;
  max-width: 95%;
  background: #192640;
  color: #b5f3e2;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

#userInput {
  width: 100%;
  min-width: 0;
  padding: 15px;
  color: white;
  background: #080f20;
  border: 1px solid #344967;
  border-radius: 14px;
  outline: none;
  font-size: 16px;
}

#userInput:focus {
  border-color: var(--blue);
}

#userInput::placeholder {
  color: #8191ad;
}

.send-row {
  display: flex;
  justify-content: center;
  gap: 13px;
  margin-top: 13px;
}

.action-button {
  min-width: 64px;
  min-height: 52px;
  padding: 10px 20px;
  border-radius: 16px;
  border: 1px solid #5265c9;
  background: linear-gradient(135deg, #397edc, #7554d8);
  font-size: 23px;
  box-shadow: 0 0 22px #6b71ff20;
}

.mic-button {
  border-color: #3b5d7e;
  background: #1a2c46;
}

.mic-button.listening {
  border-color: #ff8282;
  background: #642c42;
}

.small {
  margin: 12px 0 0;
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  line-height: 1.5;
}

#answer {
  color: #b5f3e2;
  line-height: 1.6;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.learn-button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 1px solid #344562;
  border-radius: 13px;
  background: #1a2944;
}

footer {
  text-align: center;
  padding: 23px 0 4px;
  color: #71819f;
  font-size: 11px;
}

@media (max-width: 360px) {
  .app { padding: 14px 12px 24px; }
  .character-wrap {
    transform: scale(.9);
    margin-top: 12px;
  }
  h1 { font-size: 25px; }
}

/* Character image */
.character {
  overflow: hidden;
  padding: 0;
}

.character img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  border-radius: 50%;
  display: block;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="brand">
    <div class="logo">油</div>
    <div>
      <div class="brand-name">MAXTER J</div>
      <div class="brand-sub">YOUR PERSONAL AI</div>
    </div>
  </div>

  <button class="icon-button" id="menuButton"
    aria-label="Open menu" aria-expanded="false">☰</button>
</header>

<div class="menu-panel" id="menuPanel">
  <strong id="languageTitle">Language / மொழி</strong>
  <div>
    <button onclick="setLang('en')">English</button>
    <button onclick="setLang('ta')">தமிழ்</button>
  </div>
  <button onclick="clearChat()" id="clearButton">Clear chat</button>
</div>

<section class="hero">
  <div class="online">
    <span class="dot"></span>
    <span id="onlineText">READY TO HELP</span>
  </div>

  <div class="character-wrap">
    <div class="orbit"></div>
    <div class="character" aria-label="Maxter J character">
  <img
    src="images/maxter-character.png"
    alt="Maxter J character"
  >
    </div>
  </div>

  <h1 id="greeting">Hello, I'm Maxter J</h1>
  <p class="tagline" id="tagline">
    Your personal companion.<br>
    Ask, learn and explore.
  </p>
</section>

<div class="quick-actions">
  <button class="quick" onclick="quickAsk('help')">
    <span>✦</span><span id="quickHelp">Ask AI</span>
  </button>
  <button class="quick" onclick="lesson()">
    <span>▤</span><span id="quickLearn">Learn</span>
  </button>
  <button class="quick" onclick="startVoice()">
    <span>🎙</span><span id="quickVoice">Talk</span>
  </button>
</div>

<section class="chat-panel">
  <div class="panel-title" id="chatTitle">Conversation</div>

  <div id="chatLog" aria-live="polite"></div>

  <div class="input-row">
    <input id="userInput" type="text" maxlength="500"
      placeholder="Ask me anything..."
      aria-label="Your message">
  </div>

  <div class="send-row">
    <button class="action-button" id="sendButton"
      onclick="sendMessage()" aria-label="Send message">➤</button>

    <button class="action-button mic-button" id="micButton"
      onclick="startVoice()" aria-label="Speak">🎙</button>
  </div>

  <p class="small" id="status">
    Offline starter mode • Replies are limited
  </p>

  <button class="learn-button" onclick="lesson()" id="lessonButton">
    ✧ Learn something new
  </button>

  <p id="answer"></p>
</section>

<footer>MAXTER J • YOUR AI COMPANION</footer>
</div>

<script>
let lang = 'en';
let recognition = null;

const $ = id => document.getElementById(id);

function setLang(value) {
  lang = value;
  document.documentElement.lang = value;

  $('greeting').textContent = value === 'ta'
    ? 'வணக்கம், நான் மேக்ஸ்டர் ஜே'
    : "Hello, I'm Maxter J";

  $('tagline').innerHTML = value === 'ta'
    ? 'உங்கள் தனிப்பட்ட நண்பன்.<br>கேளுங்கள், கற்றுக்கொள்ளுங்கள்.'
    : 'Your personal companion.<br>Ask, learn and explore.';

  $('onlineText').textContent = value === 'ta'
    ? 'உதவத் தயார்' : 'READY TO HELP';

  $('quickHelp').textContent = value === 'ta' ? 'கேளுங்கள்' : 'Ask AI';
  $('quickLearn').textContent = value === 'ta' ? 'கற்றல்' : 'Learn';
  $('quickVoice').textContent = value === 'ta' ? 'பேசுங்கள்' : 'Talk';
  $('chatTitle').textContent = value === 'ta' ? 'உரையாடல்' : 'Conversation';

  $('userInput').placeholder = value === 'ta'
    ? 'உங்கள் கேள்வியை எழுதுங்கள்...'
    : 'Ask me anything...';

  $('userInput').setAttribute('aria-label',
    value === 'ta' ? 'உங்கள் செய்தி' : 'Your message');

  $('sendButton').setAttribute('aria-label',
    value === 'ta' ? 'செய்தி அனுப்பு' : 'Send message');

  $('micButton').setAttribute('aria-label',
    value === 'ta' ? 'பேசுங்கள்' : 'Speak');

  $('status').textContent = value === 'ta'
    ? 'ஆஃப்லைன் தொடக்கப் பதிப்பு • பதில்கள் குறைவானவை'
    : 'Offline starter mode • Replies are limited';

  $('lessonButton').textContent = value === 'ta'
    ? '✧ புதிதாக ஒன்றைக் கற்கலாம்'
    : '✧ Learn something new';

  $('languageTitle').textContent = value === 'ta'
    ? 'மொழி / Language' : 'Language / மொழி';

  $('clearButton').textContent = value === 'ta'
    ? 'உரையாடலை அழி' : 'Clear chat';
}

function addMessage(text, type) {
  const item = document.createElement('div');
  item.className = 'chat-message ' +
    (type === 'user' ? 'user-message' : 'ai-message');

  item.textContent =
    (type === 'user' ? (lang === 'ta' ? 'நீங்கள்: ' : 'You: ')
      : 'Maxter J: ') + text;

  $('chatLog').appendChild(item);
  $('chatLog').scrollTop = $('chatLog').scrollHeight;
}

function getOfflineReply(text) {
  const msg = text.toLowerCase().trim();

  if (msg.includes('hello') || msg.includes('hi') ||
      msg.includes('வணக்கம்')) {
    return lang === 'ta'
      ? 'வணக்கம்! இன்று உங்களுக்கு என்ன உதவி வேண்டும்?'
      : "Hello! I'm Maxter J. How can I help you today?";
  }

  if (msg.includes('your name') || msg.includes('உன் பெயர்') ||
      msg.includes('உங்கள் பெயர்')) {
    return lang === 'ta'
      ? 'என் பெயர் மேக்ஸ்டர் ஜே.'
      : 'My name is Maxter J.';
  }

  if (msg.includes('time') || msg.includes('நேரம்')) {
    return lang === 'ta'
      ? 'சரியான நேரத்தை உங்கள் தொலைபேசியில் பார்க்கவும்.'
      : 'Please check your phone for the current time.';
  }

  if (msg.includes('help') || msg.includes('உதவி')) {
    return lang === 'ta'
      ? 'உங்கள் கேள்வியை எழுதுங்கள். ஆஃப்லைனில் என்னால் முடிந்தவரை உதவுகிறேன்.'
      : "Ask me a question. I'll help with the answers available offline.";
  }

  if (msg.includes('thank')) {
    return lang === 'ta'
      ? 'உங்களுக்கு உதவியதில் மகிழ்ச்சி!'
      : "You're welcome! Happy to help.";
  }

  return lang === 'ta'
    ? 'இதற்கான பதில் என்னிடம் தற்போது இல்லை. விரிவான பதில்களுக்கு உண்மையான AI இணைப்பு தேவை.'
    : "I don't have an offline answer for that yet. A real AI connection is needed for broader questions.";
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang === 'ta' ? 'ta-IN' : 'en-IN';
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

function sendMessage() {
  const input = $('userInput');
  const text = input.value.trim();

  if (!text) {
    input.focus();
    return;
  }

  addMessage(text, 'user');
  input.value = '';

  const response = getOfflineReply(text);
  addMessage(response, 'ai');
}

function quickAsk(text) {
  $('userInput').value = text;
  sendMessage();
}

$('userInput').addEventListener('keydown', event => {
  if (event.key === 'Enter') sendMessage();
});

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    $('status').textContent = lang === 'ta'
      ? 'இந்த உலாவியில் குரல் உள்ளீடு ஆதரிக்கப்படவில்லை.'
      : 'Voice input is not supported in this browser.';
    return;
  }

  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = lang === 'ta' ? 'ta-IN' : 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  $('micButton').classList.add('listening');
  $('status').textContent = lang === 'ta'
    ? 'கேட்கிறது... பேசுங்கள்'
    : 'Listening... speak now';

  recognition.onresult = event => {
    $('userInput').value =
      event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    $('status').textContent = lang === 'ta'
      ? 'குரல் உள்ளீடு தோல்வியடைந்தது. அனுமதிகளைச் சரிபார்க்கவும்.'
      : 'Voice input failed. Check microphone permissions.';
  };

  recognition.onend = () => {
    $('micButton').classList.remove('listening');
    if ($('status').textContent.includes('Listening') ||
        $('status').textContent.includes('கேட்கிறது')) {
      $('status').textContent = lang === 'ta'
        ? 'முடிந்தது.' : 'Ready.';
    }
  };

  try {
    recognition.start();
  } catch (e) {
    $('micButton').classList.remove('listening');
    $('status').textContent = lang === 'ta'
      ? 'மீண்டும் முயற்சிக்கவும்.'
      : 'Please try again.';
  }
}

function lesson() {
  const lessons = lang === 'ta'
    ? [
      'பாடம் 1: தினமும் புதிய ஒன்றைக் கற்றுக்கொள்ளுங்கள்.',
      'பாடம் 2: பெரிய பிரச்சினைகளைச் சிறிய படிகளாகப் பிரியுங்கள்.',
      'பாடம் 3: பயிற்சி செய்வதன் மூலம் புதிய திறன்களை வளர்த்துக்கொள்ளலாம்.'
    ]
    : [
      'Lesson 1: Learn something new every day.',
      'Lesson 2: Break big problems into smaller steps.',
      'Lesson 3: Practice helps you develop new skills.'
    ];

  const answer = $('answer');
  const index = Number(answer.dataset.lesson || 0);

  answer.textContent = lessons[index % lessons.length];
  answer.dataset.lesson = String((index + 1) % lessons.length);
}

function clearChat() {
  $('chatLog').replaceChildren();
  $('answer').textContent = '';
  $('answer').dataset.lesson = '0';
}

$('menuButton').addEventListener('click', () => {
  const panel = $('menuPanel');
  const isOpen = panel.classList.toggle('open');
  $('menuButton').setAttribute('aria-expanded', String(isOpen));
  $('menuButton').textContent = isOpen ? '✕' : '☰';
});
</script>
</body>
</html>
