
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>Maxter J AI</title>

<style>
:root {
  --orange: #ff7908;
  --text: #f8f8fa;
  --muted: #aeb7c5;
  --panel: rgba(5, 7, 10, 0.82);
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: #050607;
  color: var(--text);
  font-family: Arial, sans-serif;
}

body {
  background-image:
    linear-gradient(rgba(5,7,10,.12), rgba(5,7,10,.30)),
    url("images/village-bg.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

button, input {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 600px;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  padding: max(8px, env(safe-area-inset-top)) 14px
           max(8px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: transparent;
}

header {
  flex: 0 0 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  display: grid;
  place-items: center;
  border: 2px solid var(--orange);
  border-radius: 50%;
  color: var(--orange);
  font-size: 27px;
  background: rgba(5,7,10,.7);
  box-shadow: 0 0 18px #ff79082c;
}

.brand-name {
  font-size: clamp(19px, 5vw, 29px);
  font-weight: 900;
  font-style: italic;
  letter-spacing: 1px;
  white-space: nowrap;
}

.brand-name span {
  color: var(--orange);
}

.brand-underline {
  width: 82%;
  height: 4px;
  margin: 4px auto 0;
  background: var(--orange);
  transform: rotate(-2deg);
  border-radius: 4px;
}

.menu-button {
  width: 44px;
  height: 44px;
  border: 0;
  background: rgba(5,7,10,.65);
  border-radius: 12px;
  color: var(--orange);
  font-size: 29px;
}

.menu-panel {
  display: none;
  flex: 0 0 auto;
  max-height: 32vh;
  overflow-y: auto;
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid #6c3a19;
  border-radius: 14px;
  background: rgba(12,14,17,.96);
}

.menu-panel.open {
  display: block;
}

.menu-panel button {
  padding: 9px 12px;
  margin: 5px 4px 0 0;
  border: 1px solid #4a3425;
  border-radius: 10px;
  background: #20170f;
}

.menu-panel button:active {
  background: #513019;
}

#backgroundPicker {
  display: none;
}

/* Main character scene */

.character-stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  margin: 4px 0 8px;
  overflow: hidden;
  border-radius: 20px;
  background: transparent;
}

.character-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
  transform-origin: center bottom;
  animation: maxterIdle 3s ease-in-out infinite;
  will-change: transform;
  -webkit-user-drag: none;
  user-select: none;
}

@keyframes maxterIdle {
  0%, 100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-7px) scale(1.008);
  }
}

.action-greeting .character-image {
  animation: maxterGreeting .7s ease-in-out 2;
}

@keyframes maxterGreeting {
  0%, 100% { transform: translateY(0) rotate(0); }
  35% { transform: translateY(-10px) rotate(-2deg); }
  70% { transform: translateY(-4px) rotate(2deg); }
}

.action-thinking .character-image {
  animation: maxterThinking 1s ease-in-out infinite alternate;
}

@keyframes maxterThinking {
  from { transform: translateY(0) rotate(-1deg); }
  to { transform: translateY(-4px) rotate(1deg); }
}

.action-speaking .character-image {
  animation: maxterSpeaking .45s ease-in-out infinite alternate;
}

@keyframes maxterSpeaking {
  from { transform: translateY(0) scale(1); }
  to { transform: translateY(-3px) scale(1.01); }
}

.image-warning {
  position: absolute;
  inset: 40% 8% auto;
  color: var(--orange);
  text-align: center;
  font-size: 13px;
  background: rgba(0,0,0,.85);
  padding: 12px;
  border-radius: 12px;
}

.greeting-bubble {
  position: absolute;
  z-index: 1;
  top: 10%;
  right: 4px;
  width: min(65%, 290px);
  padding: 11px;
  background: rgba(9,11,13,.92);
  border: 2px solid var(--orange);
  border-radius: 18px;
  box-shadow: 0 0 18px #ff79081c;
  line-height: 1.4;
  font-size: 13px;
}

.greeting-bubble strong {
  display: block;
  margin-bottom: 5px;
  font-size: 15px;
}

.bubble-symbol {
  float: right;
  color: var(--orange);
  font-size: 21px;
}

/* Chat */

.chat-area {
  flex: 0 0 auto;
  min-height: 0;
  padding-top: 2px;
}

.chat-log {
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: 17vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin-bottom: 8px;
  scrollbar-width: thin;
  scrollbar-color: #6c452b transparent;
}

.chat-message {
  max-width: 94%;
  padding: 9px 12px;
  border-radius: 13px;
  line-height: 1.45;
  font-size: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user-message {
  align-self: flex-end;
  text-align: right;
  background: rgba(36,23,15,.94);
  border: 1px solid #78401b;
}

.ai-message {
  align-self: flex-start;
  text-align: left;
  background: rgba(15,18,21,.94);
  border: 1px solid #39332e;
}

.composer {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  min-height: 58px;
  padding: 5px 7px;
  border: 2px solid var(--orange);
  border-radius: 44px;
  background: rgba(11,14,16,.96);
  box-shadow: 0 0 18px #ff790825;
}

.attach-button {
  width: 32px;
  height: 42px;
  flex: 0 0 32px;
  border: 0;
  background: transparent;
  color: #d7deeb;
  font-size: 26px;
}

#userInput {
  flex: 1 1 auto;
  width: 0;
  min-width: 0;
  padding: 10px 2px;
  border: 0;
  outline: none;
  color: white;
  background: transparent;
  font-size: 15px;
}

#userInput::placeholder {
  color: #a3afc1;
}

.composer-mic {
  width: 30px;
  height: 40px;
  flex: 0 0 30px;
  border: 0;
  background: transparent;
  color: #dbe3f1;
  font-size: 21px;
}

.composer-mic.listening {
  color: #ff7777;
}

.send-button {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  border: 0;
  border-radius: 50%;
  background: var(--orange);
  color: #111;
  font-size: 25px;
  font-weight: bold;
}

.footer-status {
  flex: 0 0 auto;
  padding: 5px 0 1px;
  text-align: center;
  font-size: 11px;
  color: #fff;
  text-shadow: 0 1px 4px #000;
}

@media (max-height: 650px) {
  header { flex-basis: 50px; }

  .logo {
    width: 40px;
    height: 40px;
    flex-basis: 40px;
    font-size: 23px;
  }

  .character-stage {
    margin-top: 2px;
    margin-bottom: 5px;
  }

  .chat-log { max-height: 12vh; }

  .composer { min-height: 52px; }

  .send-button {
    width: 39px;
    height: 39px;
    flex-basis: 39px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .character-image {
    animation-duration: 4s;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="logo">油</div>
      <div>
        <div class="brand-name">MAXTER <span>J</span></div>
        <div class="brand-underline"></div>
      </div>
    </div>

    <button class="menu-button" id="menuButton"
      aria-label="Open menu" aria-expanded="false">☰</button>
  </header>

  <div class="menu-panel" id="menuPanel">
    <strong id="languageTitle">Language / மொழி</strong><br>

    <button type="button" onclick="setLang('en')">English</button>
    <button type="button" onclick="setLang('ta')">தமிழ்</button>

    <button type="button" id="changeBackgroundButton">
      Change Background
    </button>

    <button type="button" id="resetBackgroundButton">
      Reset Background
    </button>

    <input type="file" id="backgroundPicker"
      accept="image/*">

    <button type="button" onclick="clearChat()" id="clearButton">
      Clear chat
    </button>
  </div>

  <section class="character-stage" id="characterStage">

    <img class="character-image"
      id="characterImage"
      src="images/21574.png"
      alt="Maxter J character"
      draggable="false">

    <div class="image-warning" id="imageWarning" hidden>
      Character image missing. Check images/21574.png in GitHub.
    </div>

    <div class="greeting-bubble">
      <strong>
        <span id="bubbleTitle">Hey! I'm Jiraiya</span>
        <span class="bubble-symbol">☯</span>
      </strong>
      <span id="bubbleText">
        What do you want to know or do today?
      </span>
    </div>

  </section>

  <section class="chat-area">
    <div class="chat-log" id="chatLog"
      role="log" aria-live="polite"></div>

    <div class="composer">
      <button class="attach-button" id="attachButton"
        type="button" aria-label="Attach file">＋</button>

      <input id="userInput" type="text"
        placeholder="Ask Maxter J anything..."
        autocomplete="off"
        aria-label="Message Maxter J">

      <button class="composer-mic" id="composerMic"
        type="button" aria-label="Voice input">🎙</button>

      <button class="send-button" id="sendButton"
        type="button" aria-label="Send message">➤</button>
    </div>
  </section>

  <div class="footer-status" id="footerStatus">
    ● Offline • Starter mode
  </div>

</div>

<script>
let lang = 'en';
let recognition = null;
let isSending = false;
let backgroundObjectUrl = null;

const $ = id => document.getElementById(id);

const DEFAULT_BACKGROUND = 'images/village-bg.png';
const BACKGROUND_STORAGE_KEY = 'maxterJ_customBackground';

/* Character image status */

$('characterImage').addEventListener('error', () => {
  $('imageWarning').hidden = false;
});

$('characterImage').addEventListener('load', () => {
  $('imageWarning').hidden = true;
});

/* Background customization */

function applyBackground(imageUrl) {
  document.body.style.backgroundImage =
    'linear-gradient(rgba(5,7,10,.12), rgba(5,7,10,.30)), ' +
    'url("' + imageUrl + '")';
}

function resetBackground() {
  try {
    localStorage.removeItem(BACKGROUND_STORAGE_KEY);
  } catch (error) {}

  if (backgroundObjectUrl) {
    URL.revokeObjectURL(backgroundObjectUrl);
    backgroundObjectUrl = null;
  }

  applyBackground(DEFAULT_BACKGROUND);
}

$('changeBackgroundButton').addEventListener('click', () => {
  $('backgroundPicker').click();
});

$('resetBackgroundButton').addEventListener('click', resetBackground);

$('backgroundPicker').addEventListener('change', function () {
  const file = this.files && this.files[0];

  if (!file) return;

  if (!file.type.startsWith('image/')) {
    alert('Please select an image file.');
    this.value = '';
    return;
  }

  // Keep saved images reasonably small for WebView storage.
  if (file.size > 2 * 1024 * 1024) {
    alert('Please choose an image smaller than 2 MB.');
    this.value = '';
    return;
  }

  const reader = new FileReader();

  reader.onload = () => {
    const imageUrl = reader.result;

    const testImage = new Image();

    testImage.onload = () => {
      applyBackground(imageUrl);

      try {
        localStorage.setItem(BACKGROUND_STORAGE_KEY, imageUrl);
      } catch (error) {
        alert('Background changed, but could not be saved permanently.');
      }
    };

    testImage.onerror = () => {
      alert('Could not load this image. Please try another one.');
    };

    testImage.src = imageUrl;
  };

  reader.onerror = () => {
    alert('Could not read the selected image.');
  };

  reader.readAsDataURL(file);
  this.value = '';
});

function restoreBackground() {
  try {
    const saved = localStorage.getItem(BACKGROUND_STORAGE_KEY);

    if (saved && saved.startsWith('data:image/')) {
      applyBackground(saved);
    }
  } catch (error) {
    // The default village background remains available.
  }
}

restoreBackground();

/* Language */

function setLang(value) {
  lang = value;
  document.documentElement.lang = value;

  $('bubbleTitle').textContent = value === 'ta'
    ? 'வணக்கம்! நான் ஜிரையா'
    : "Hey! I'm Jiraiya";

  $('bubbleText').textContent = value === 'ta'
    ? 'இன்று என்ன தெரிந்துகொள்ள அல்லது செய்ய விரும்புகிறீர்கள்?'
    : 'What do you want to know or do today?';

  $('userInput').placeholder = value === 'ta'
    ? 'மேக்ஸ்டர் ஜேவிடம் கேளுங்கள்...'
    : 'Ask Maxter J anything...';

  $('languageTitle').textContent = value === 'ta'
    ? 'மொழி / Language'
    : 'Language / மொழி';

  $('clearButton').textContent = value === 'ta'
    ? 'உரையாடலை அழி'
    : 'Clear chat';

  $('changeBackgroundButton').textContent = value === 'ta'
    ? 'பின்னணியை மாற்று'
    : 'Change Background';

  $('resetBackgroundButton').textContent = value === 'ta'
    ? 'இயல்புநிலை பின்னணி'
    : 'Reset Background';

  $('footerStatus').textContent = value === 'ta'
    ? '● ஆஃப்லைன் • தொடக்கப் பதிப்பு'
    : '● Offline • Starter mode';
}

/* Chat */

function addMessage(text, type) {
  const item = document.createElement('div');

  item.className = 'chat-message ' +
    (type === 'user' ? 'user-message' : 'ai-message');

  const prefix = type === 'user'
    ? (lang === 'ta' ? 'நீங்கள்: ' : 'You: ')
    : 'Maxter J: ';

  item.textContent = prefix + text;

  $('chatLog').appendChild(item);
  $('chatLog').scrollTop = $('chatLog').scrollHeight;
}

function getOfflineReply(text) {
  const msg = text.toLowerCase().trim();

  if (
    msg.includes('hello') ||
    msg.includes('hi') ||
    msg.includes('வணக்கம்')
  ) {
    return lang === 'ta'
      ? 'வணக்கம்! இன்று உங்களுக்கு என்ன உதவி வேண்டும்?'
      : "Hello! I'm Maxter J. How can I help you today?";
  }

  if (
    msg.includes('your name') ||
    msg.includes('உன் பெயர்') ||
    msg.includes('உங்கள் பெயர்')
  ) {
    return lang === 'ta'
      ? 'என் பெயர் மேக்ஸ்டர் ஜே.'
      : 'My name is Maxter J.';
  }

  if (msg.includes('help') || msg.includes('உதவி')) {
    return lang === 'ta'
      ? 'உங்கள் கேள்வியை எழுதுங்கள். என்னால் முடிந்தவரை உதவுகிறேன்.'
      : 'Tell me what you need help with.';
  }

  if (msg.includes('thank') || msg.includes('நன்றி')) {
    return lang === 'ta'
      ? 'உங்களுக்கு உதவியதில் மகிழ்ச்சி!'
      : "You're welcome! Happy to help.";
  }

  return lang === 'ta'
    ? 'இந்தக் கேள்விக்கான பதில் எனது ஆஃப்லைன் பதிப்பில் இல்லை. விரிவான பதில்களுக்கு உண்மையான AI இணைப்பு தேவை.'
    : "I don't have an offline answer for that yet. A real AI connection is needed for broader questions.";
}

/* Character animations */

function setCharacterAction(action, duration = 0) {
  const stage = $('characterStage');

  stage.classList.remove(
    'action-greeting',
    'action-thinking',
    'action-speaking'
  );

  if (action) {
    stage.classList.add('action-' + action);
  }

  if (duration > 0) {
    window.setTimeout(() => {
      stage.classList.remove('action-' + action);
    }, duration);
  }
}

/* Voice output */

function speak(text) {
  if (!('speechSynthesis' in window)) {
    setCharacterAction('speaking', 1500);
    return;
  }

  window.speechSynthesis.cancel();
  setCharacterAction('speaking');

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang === 'ta' ? 'ta-IN' : 'en-IN';
  utterance.rate = 1;

  utterance.onend = () => setCharacterAction('');
  utterance.onerror = () => setCharacterAction('');

  window.speechSynthesis.speak(utterance);
}

/* Send message */

function sendMessage() {
  if (isSending) return;

  const input = $('userInput');
  const text = input.value.trim();

  if (!text) {
    input.focus();
    return;
  }

  isSending = true;
  input.value = '';

  addMessage(text, 'user');
  setCharacterAction('thinking');

  // This is an offline demo response, not an AI API call.
  const response = getOfflineReply(text);

  addMessage(response, 'ai');
  setCharacterAction('speaking', 1800);
  speak(response);

  window.setTimeout(() => {
    isSending = false;
  }, 500);
}

$('sendButton').addEventListener('click', sendMessage);

$('userInput').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    sendMessage();
  }
});

/* Voice input */

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage(
      lang === 'ta'
        ? 'இந்த உலாவியில் குரல் உள்ளீடு ஆதரிக்கப்படவில்லை.'
        : 'Voice input is not supported in this browser.',
      'ai'
    );
    return;
  }

  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = lang === 'ta' ? 'ta-IN' : 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  $('composerMic').classList.add('listening');

  recognition.onresult = event => {
    $('userInput').value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    addMessage(
      lang === 'ta'
        ? 'குரல் உள்ளீடு தோல்வியடைந்தது. மைக்ரோஃபோன் அனுமதியைச் சரிபார்க்கவும்.'
        : 'Voice input failed. Check microphone permission.',
      'ai'
    );
  };

  recognition.onend = () => {
    $('composerMic').classList.remove('listening');
  };

  try {
    recognition.start();
  } catch (error) {
    $('composerMic').classList.remove('listening');
  }
}

$('composerMic').addEventListener('click', startVoice);

/* Clear chat */

function clearChat() {
  $('chatLog').replaceChildren();
}

/* Menu */

$('menuButton').addEventListener('click', () => {
  const panel = $('menuPanel');
  const isOpen = panel.classList.toggle('open');

  $('menuButton').setAttribute('aria-expanded', String(isOpen));
  $('menuButton').textContent = isOpen ? '✕' : '☰';
});

/* Attachment placeholder */

$('attachButton').addEventListener('click', () => {
  addMessage(
    lang === 'ta'
      ? 'கோப்பு இணைப்பு இன்னும் செயல்படுத்தப்படவில்லை.'
      : 'File attachments are not implemented yet.',
    'ai'
  );
});
</script>
</body>
</html>
