plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jiraiyaai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jiraiyaai.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }

    signingConfigs {
        release {
            // Reads upload keystore credentials from environment variables when provided in GitHub Actions Secrets or local env
            def keystorePath = System.getenv("UPLOAD_KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
